name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - name: Check generated routes
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "src/routeTree.gen.ts is out of date. Run 'bun run generate-routes' and commit the result."
            exit 1
          fi
      - run: bun run check
